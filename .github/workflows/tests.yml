name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workers:
    name: Real rootless script workers (synthetic inputs)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Delegate resource controllers to the ephemeral runner account
        run: |
          sudo mkdir -p /etc/systemd/system/user@.service.d
          printf '[Service]\nDelegate=cpu cpuset io memory pids\n' | sudo tee /etc/systemd/system/user@.service.d/portkeeper-delegate.conf >/dev/null
          sudo systemctl daemon-reload
          sudo loginctl enable-linger "$(id -un)"
          sudo systemctl start "user@$(id -u).service"
          printf 'XDG_RUNTIME_DIR=/run/user/%s\nDBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/%s/bus\n' "$(id -u)" "$(id -u)" >> "$GITHUB_ENV"
      - uses: docker/setup-docker-action@e43656e248c0bd0647d3f5c195d116aacf6fcaf4 # v4
        with:
          rootless: true
          daemon-config: '{"exec-opts": ["native.cgroupdriver=systemd"]}'
      - name: Build the public worker environment
        run: docker build -f Dockerfile.worker --tag portkeeper-worker:checks .
      - name: Check actual isolation, compilation, read-only inputs, replay and cancellation
        run: |
          curl --fail --location --retry 2 --max-time 120 --output "$RUNNER_TEMP/openlara-win.zip" \
            https://github.com/XProger/OpenLara/releases/download/latest/OpenLara_win.zip
          printf '%s  %s\n' d24cbf90ee4ef94414c64808d3aa13198079faf72d9ea3cae393675284929ad1 "$RUNNER_TEMP/openlara-win.zip" | sha256sum --check
          PORTKEEPER_TEST_WORKER_IMAGE=$(docker image inspect --format '{{.Id}}' portkeeper-worker:checks)
          PORTKEEPER_TEST_OPENLARA_ZIP="$RUNNER_TEMP/openlara-win.zip"
          export PORTKEEPER_TEST_OPENLARA_ZIP
          export PORTKEEPER_TEST_WORKER_IMAGE PORTKEEPER_TEST_ROOTLESS=1
          set +e
          python -W error -m unittest discover -s tests -p test_real_workers.py -v > "$RUNNER_TEMP/worker-tests.log" 2>&1
          worker_status=$?
          set -e
          cat "$RUNNER_TEMP/worker-tests.log"
          if [ "$worker_status" -ne 0 ]; then
            python -c 'import os,pathlib; text=pathlib.Path(os.environ["RUNNER_TEMP"],"worker-tests.log").read_text()[-12000:]; print("::error::"+text.replace("%","%25").replace("\r","%0D").replace("\n","%0A"))'
          fi
          exit "$worker_status"

  ps4_extraction:
    name: Real PS4 extraction (synthetic files)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the runner image
        run: docker build --tag portkeeper:checks .
      - name: Check native subscription CLI contracts without login or inference
        run: |
          docker run --rm --network none --read-only --user 10001:10001 \
            --cap-drop ALL --security-opt no-new-privileges:true --pids-limit 512 \
            --tmpfs /tmp:exec,size=512m \
            --entrypoint python --workdir /source \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/source,readonly" \
            -e PYTHONPATH=/source -e PORTKEEPER_TEST_SUBSCRIPTION_CLIS=1 \
            portkeeper:checks -W error -m unittest discover -s tests -p test_real_subscription_agents.py -v
      - name: Download the pinned extraction tool
        run: |
          curl --fail --location --retry 2 --max-time 120 \
            --output "$RUNNER_TEMP/pkgtool.zip" \
            https://github.com/maxton/LibOrbisPkg/releases/download/v0.2/PkgTool.Core-linux-x64-0.2.231.zip
          printf '%s  %s\n' ac897d06a0c90256f4297712cb503eb29173fbc6d7f8a936ff476c4b72e5f36e "$RUNNER_TEMP/pkgtool.zip" | sha256sum --check
      - name: Check real extraction, base/update merging and cache reuse
        run: |
          docker run --rm --network none --read-only --user 10001:10001 \
            --cap-drop ALL --security-opt no-new-privileges:true --pids-limit 512 \
            --tmpfs /tmp:exec,size=512m \
            --entrypoint python --workdir /source \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/source,readonly" \
            --mount "type=bind,source=$RUNNER_TEMP/pkgtool.zip,target=/fixture/tool.zip,readonly" \
            -e PYTHONPATH=/source -e PORTKEEPER_TEST_PKGTOOL_ZIP=/fixture/tool.zip \
            portkeeper:checks -W error -m unittest discover -s tests -p test_real_ps4_extraction.py -v

  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Standard-library test suite
        run: python -W error -m unittest discover -s tests -v

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Check browser JavaScript
        run: node --check static/app.js
      - name: Check library layout interactions
        run: |
          npm install --prefix "$RUNNER_TEMP/portkeeper-ui-tests" --no-audit --no-fund jsdom@26.1.0
          PORTKEEPER_JSDOM="$RUNNER_TEMP/portkeeper-ui-tests/node_modules/jsdom" node tests/test_ui_layouts.cjs
